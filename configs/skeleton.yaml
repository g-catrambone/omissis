# Skeleton run: D0 -> R1 -> echo -> restore. No real model is involved.
# Run it once with backend: cloud to fill the cache, then with backend: replay.
detector: D0
strategy: R1
mask_quasi: false
backend: cloud             # misses go to the provider, here the built-in echo
seed: 13
fuzzy_threshold: 0.9       # minimum similarity for fuzzy restore
source_priority: [D0, D1, D2, D3]
models_file: configs/models.echo.yaml
cache_dir: results/scratch/skeleton
