# The five fixtures on gold spans with R2, sent once to the real cloud model:
#   uv run --env-file .env omissis batch --config configs/gold-r2.yaml --input-dir data/fixtures
# The output holds the original values: read it on screen, do not save it under results/.
detector: GOLD
strategy: R2
mask_quasi: true
backend: cloud
seed: 20261111
fuzzy_threshold: 0.9
source_priority: [D0, D2, D1, D3]
models_file: configs/models.yaml
cache_dir: results/cache
