[project]
name = "omissis"
version = "0.1.0"
description = "Local pseudonymisation layer between a user and a cloud LLM, for Italian text."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml==6.0.2",
]

[project.scripts]
omissis = "omissis.cli:main"

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.13",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omissis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
